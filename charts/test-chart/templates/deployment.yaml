apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
    chart-version: "v2.0"
    scenario: {{ .Values.scenario | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
    chart-version: "v2.0"
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    chart-version: "v2.0"
        scenario: {{ .Values.scenario | quote }}
      annotations:
        scenario: {{ .Values.scenario | quote }}
        {{- if .Values.environment }}
        environment: {{ .Values.environment | quote }}
        {{- end }}
    spec:
      containers:
      - name: nginx
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 80
